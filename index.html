<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/7ee5f2ba27.js" crossorigin="anonymous"></script>
    <link rel="icon" href="images/favicon.png" type="image/x-icon">
</head>
<body>
    <div class="wrapper">
        <div class="currencyChoiceBtns">
                <button type="button" id="openCurrencyFromBtn"><img src="images/eur.svg" id="openCurrencyFromBtnImg">EUR</button>
                <button type="button" id="openCurrencyToBtn"><img src="images/eur.svg" id="openCurrencyToBtnImg">EUR</button>
        </div>
            <div class="currencyFromBtns hidden">
                <div class="currencyBtnsLayout">
                    <button type="button" class="currencyFromBtn"><img src="images/eur.svg" alt="eur" class="currencyImg">EUR</button>
                    <button type="button" class="currencyFromBtn"><img src="images/usd.svg" alt="usd" class="currencyImg">USD</button>
                    <button type="button" class="currencyFromBtn"><img src="images/gbp.svg" alt="gbp" class="currencyImg">GBP</button>
                    <button type="button" class="currencyFromBtn"><img src="images/jpy.svg" alt="jpy" class="currencyImg">JPY</button>
                    <button type="button" class="currencyFromBtn"><img src="images/cny.svg" alt="cny" class="currencyImg">CNY</button>
                    <button type="button" class="currencyFromBtn"><img src="images/chf.svg" alt="chf" class="currencyImg">CHF</button>
                    <button type="button" class="currencyFromBtn"><img src="images/aud.svg" alt="aud" class="currencyImg">AUD</button>
                    <button type="button" class="currencyFromBtn"><img src="images/cad.svg" alt="cad" class="currencyImg">CAD</button>
                    <button type="button" class="currencyFromBtn"><img src="images/hkd.svg" alt="hkd" class="currencyImg">HKD</button>
                    <button type="button" class="currencyFromBtn"><img src="images/nzd.svg" alt="nzd" class="currencyImg">NZD</button>
                </div>
            </div>
            <div class="currencyToBtns hidden">
                <div class="currencyBtnsLayout">
                    <button type="button" class="currencyToBtn"><img src="images/eur.svg" alt="eur" class="currencyImg">EUR</button>
                    <button type="button" class="currencyToBtn"><img src="images/usd.svg" alt="usd" class="currencyImg">USD</button>
                    <button type="button" class="currencyToBtn"><img src="images/gbp.svg" alt="gbp" class="currencyImg">GBP</button>
                    <button type="button" class="currencyToBtn"><img src="images/jpy.svg" alt="jpy" class="currencyImg">JPY</button>
                    <button type="button" class="currencyToBtn"><img src="images/cny.svg" alt="cny" class="currencyImg">CNY</button>
                    <button type="button" class="currencyToBtn"><img src="images/chf.svg" alt="chf" class="currencyImg">CHF</button>
                    <button type="button" class="currencyToBtn"><img src="images/aud.svg" alt="aud" class="currencyImg">AUD</button>
                    <button type="button" class="currencyToBtn"><img src="images/cad.svg" alt="cad" class="currencyImg">CAD</button>
                    <button type="button" class="currencyToBtn"><img src="images/hkd.svg" alt="hkd" class="currencyImg">HKD</button>
                    <button type="button" class="currencyToBtn"><img src="images/nzd.svg" alt="nzd" class="currencyImg">NZD</button>
                </div>
            </div>
        <div class="amount">
            <input type="number" id="amount-to-convert" placeholder="Enter Amount">
        </div>
        <button type="button" id="convert-btn">Convert</button>
        <div class="result-container">
            <p id="result">Results will appear here</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
