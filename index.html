<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/7ee5f2ba27.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="wrapper">
        <div class="currencyChoice">
            <select id="currency-from">
                <option value="eur">EUR</option>
                <option value="usd">USD</option>
                <option value="gbp">GBP</option>
                <option value="jpy">JPY</option>
                <option value="cny">CNY</option>
                <option value="chf">CHF</option>
                <option value="aud">AUD</option>
                <option value="cad">CAD</option>
                <option value="hkd">HKD</option>
                <option value="nzd">NZD</option>
            </select>
            <select id="currency-to">
                <option value="eur">EUR</option>
                <option value="usd">USD</option>
                <option value="gbp">GBP</option>
                <option value="jpy">JPY</option>
                <option value="cny">CNY</option>
                <option value="chf">CHF</option>
                <option value="aud">AUD</option>
                <option value="cad">CAD</option>
                <option value="hkd">HKD</option>
                <option value="nzd">NZD</option>
            </select>
        </div>
        <div class="amount">
            <label for="amount-to-convert">Amount: </label>
            <input type="number" id="amount-to-convert" placeholder="Enter Amount">
        </div>
        <button type="button" id="convert-btn">Convert</button>
        <div class="result-container">
            <p id="result"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
